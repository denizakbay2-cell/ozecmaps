# The production stack on one server: Caddy (HTTPS, compression) -> the application -> PostgreSQL.
# scripts/deploy-server.sh copies this file to /opt/rota on the server together with the Caddyfile, the national graph
# (data/turkey-car.graph) and an .env with SITE_ADDRESS, DB_PASSWORD and ADMIN_TOKEN, then starts it.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: city_navigator
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing from .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d city_navigator"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: &logging
      options:
        max-size: "10m"
        max-file: "3"

  app:
    # built on the deploying machine and loaded with docker load; never pulled
    image: city-navigator-app
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/city_navigator
      DB_USER: navigator
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN missing from .env}
      DEMO_DATA: "true"
      NATIONAL_GRAPH_FILE: /data/turkey-car.graph
      # 70 % of the 2 GB limit for the heap: the national graph needs about 800 MB of it
      MEM_MAX_RAM_PERCENTAGE: "70.0"
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    mem_limit: 2g
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS missing from .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
